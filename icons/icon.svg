<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4b3e"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
  </defs>
  <!-- red rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#red)"/>
  <!-- speedometer dial: a 240-degree arc -->
  <path d="M33.7 89.5 A36 36 0 1 1 94.3 89.5" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <!-- ticks -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="44" x2="64" y2="50"/>
    <line x1="43" y1="53" x2="47.5" y2="57.5"/>
    <line x1="85" y1="53" x2="80.5" y2="57.5"/>
  </g>
  <!-- needle pointing to "fast" -->
  <line x1="64" y1="76" x2="86" y2="54" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="64" cy="76" r="9" fill="#fff"/>
  <circle cx="64" cy="76" r="3.5" fill="#c8102e"/>
</svg>
